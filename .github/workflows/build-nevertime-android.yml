name: Build Nevertime Client APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'nevertime-android/**'
      - '.github/workflows/build-nevertime-android.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser preview tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nevertime-ui" playwright@1.56.1
          "$RUNNER_TEMP/nevertime-ui/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-roboto
      - name: Check and render launcher
        working-directory: nevertime-android
        run: NODE_PATH="$RUNNER_TEMP/nevertime-ui/node_modules" node tests/visual.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Nevertime-UI-Previews
          path: nevertime-android/build/ui-preview/*.png
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install native toolchain
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: nevertime-android
        run: |
          if ! gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug; then
            if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
              cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            fi
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Nevertime-Client-APK
          path: nevertime-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
