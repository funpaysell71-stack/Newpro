name: Generate website with AI team
on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Website request (topic, style, functionality)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-site-generation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site (Designer → Developer → QA)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          SITE_BRIEF: ${{ inputs.brief }}
        run: python scripts/generate_site.py
      - name: Validate generated files
        run: |
          test -s index.html
          grep -iq '<!doctype html' index.html
          grep -iq '</html>' index.html
          test -s DESIGN_SPEC.md
          test -s QA_REPORT.md
      - name: Open pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai/site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add index.html DESIGN_SPEC.md QA_REPORT.md
          git commit -m "Generate website with Designer, Developer and QA"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "AI website: review generated site" --body "Generated by Designer → Developer → QA. Automated model-based review only; manually check appearance, content, interactions and mobile layout before merging."
